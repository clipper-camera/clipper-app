name: Auto Sync Versions

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-versions:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0
    
    - name: Sync versions
      run: |
        # Skip if this is an auto-sync commit to prevent infinite loops
        if git log -1 --pretty=%B | grep -q "chore: auto-sync versions from app.json"; then
          echo "⏭️ Auto-sync commit detected, skipping to prevent infinite loop"
          exit 0
        fi
        
        npm ci
        npm run sync-version
        
        if [ -n "$(git status --porcelain)" ]; then
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "chore: auto-sync versions from app.json"
          git push
          echo "✅ Versions synced and committed"
        else
          echo "✅ All versions already in sync"
        fi
