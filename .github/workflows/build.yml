name: Build and Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  android:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Inject version from app.json
      run: npm run inject-version
    
    - name: Install Expo CLI
      run: npm install -g expo-cli
    
    - name: Generate Android project
      run: npx expo prebuild -p android
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platform-tools'
    
    - name: Setup Android environment variables
      run: |
        echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
        echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
    
    - name: Build Android Debug APK
      run: |
        cd android
        ./gradlew assembleDebug --no-daemon
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Inject version from app.json
      run: npm run inject-version
    
    - name: Install Expo CLI
      run: npm install -g expo-cli
    
    - name: Generate iOS project
      run: npx expo prebuild -p ios

    # fmt's consteval code doesn't compile on the latest Xcode; building just
    # that pod as C++17 turns it off. Must come after react_native_post_install,
    # which forces every pod to C++20
    - name: Build fmt pod as C++17
      run: |
        perl -0pi -e "s/(react_native_post_install\(.*?\n\s*\)\n)/\$1    installer.pods_project.targets.each { |t| t.build_configurations.each { |c| c.build_settings['CLANG_CXX_LANGUAGE_STANDARD'] = 'c++17' } if t.name == 'fmt' }\n/s" ios/Podfile
        grep -q "c++17" ios/Podfile
        grep -n -A12 "post_install do" ios/Podfile

    - name: List iOS directory contents
      run: ls -la ios/
    
    - name: Install CocoaPods
      run: |
        cd ios
        pod install
        ls -la
    
    - name: Build iOS Debug
      run: |
        cd ios
        xcodebuild -list
        xcodebuild -workspace Clipper.xcworkspace -scheme Clipper -configuration Debug -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 17' build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO
    
    - name: Upload iOS Build
      uses: actions/upload-artifact@v4
      with:
        name: ios-build
        path: ios/build
